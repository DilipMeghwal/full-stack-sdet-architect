name: Playwright Tests

on:
  push:
    branches: [ develop, main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      parabank:
        image: parasoft/parabank
        ports:
          - 8080:8080
          - 9001:9001
        options: >-
          --health-cmd="curl -f http://localhost:8080/parabank/index.htm || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        env:
          BASE_URL: http://localhost:8080/parabank
        run: npx playwright test --shard=${{ matrix.shard }}/2

      # - name: Generate Allure Report
      #   run: |
      #     npx allure generate allure-results -o allure-report --clean

      # - name: Upload Allure Report
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: allure-report-${{ matrix.shard }}
      #     path: allure-report

      # Upload results (IMPORTANT)
      - uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results
  
  merge-reports:
    needs: test   # 🔥 ensures all shards finish first
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 📥 Download all shard artifacts
      - uses: actions/download-artifact@v4
        with:
          path: allure-results

      # 🧹 Merge all results
      - name: Merge results
        run: |
          mkdir merged-results
          find allure-results -name "*.json" -exec cp {} merged-results \;

      # 📊 Generate Allure report
      - name: Generate report
        run: |
          npm install -g allure-commandline
          allure generate merged-results -o allure-report

      # 📤 Upload final report
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report