apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: allure-results-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parabank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parabank
  template:
    metadata:
      labels:
        app: parabank
    spec:
      containers:
        - name: parabank
          image: parasoft/parabank
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: parabank
spec:
  selector:
    app: parabank
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: batch/v1
kind: Job
metadata:
  name: playwright-tests
spec:
  completions: 3
  parallelism: 3
  template:
    metadata:
      labels:
        app: tests
    spec:
      restartPolicy: Never
      containers:
        - name: tests
          image: playwright-tests   # ⚠️ your built image
          command: ["npx", "playwright", "test"]
          env:
            - name: BASE_URL
              value: http://parabank:8080
          volumeMounts:
            - name: allure-volume
              mountPath: /app/allure-results
      volumes:
        - name: allure-volume
          persistentVolumeClaim:
            claimName: allure-results-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: allure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: allure
  template:
    metadata:
      labels:
        app: allure
    spec:
      containers:
        - name: allure
          image: frankescobar/allure-docker-service
          ports:
            - containerPort: 5050
          volumeMounts:
            - name: allure-volume
              mountPath: /app/allure-results
      volumes:
        - name: allure-volume
          persistentVolumeClaim:
            claimName: allure-results-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: allure
spec:
  type: NodePort
  selector:
    app: allure
  ports:
    - port: 5050
      targetPort: 5050
      nodePort: 30007